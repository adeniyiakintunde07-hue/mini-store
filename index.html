<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Motors Collection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Luxury Motors Collection</h1>
        <div class="cart-icon" onclick="cart.toggleDisplay()">
            🛒 Cart (<span id="cart-count">0</span>)
        </div>
    </header>

    <main id="car-list" class="car-grid"></main>

    <aside id="shopping-cart">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <div class="cart-total">
            Total: <span id="cart-total-price">£0.00</span>
        </div>
        <button onclick="cart.checkout()">Purchase</button>
        <button onclick="cart.nuke()">Empty Cart</button>
    </aside>
    
    <script src="app.js"></script>
</body>
</html>
